<h2 mat-dialog-title>{{ datos.titulo | translate }}</h2>
<mat-dialog-content>
  <p>{{ datos.mensaje | translate }}</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button [mat-dialog-close]="false">
    {{ datos.textoCancelar ?? 'compartido.acciones.cancelar' | translate }}
  </button>
  <button mat-flat-button [mat-dialog-close]="true" [class.boton-peligro]="datos.peligro">
    {{ datos.textoConfirmar ?? 'compartido.acciones.confirmar' | translate }}
  </button>
</mat-dialog-actions>
