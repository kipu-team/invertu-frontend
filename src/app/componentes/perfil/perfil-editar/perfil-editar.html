
<div class="perfil-editar">
  <h2>{{ 'perfil.editar.titulo' | translate }}</h2>

  <form #formulario="ngForm" (ngSubmit)="guardar()">
    <div class="campo">
      <label for="nombres">
        {{ 'perfil.campos.nombres' | translate }}
      </label>
      <input
        id="nombres"
        name="nombres"
        type="text"
        [(ngModel)]="nombres"
        required
        maxlength="100"
      />
    </div>

    <div class="campo">
      <label for="apellidos">
        {{ 'perfil.campos.apellidos' | translate }}
      </label>
      <input
        id="apellidos"
        name="apellidos"
        type="text"
        [(ngModel)]="apellidos"
        required
        maxlength="100"
      />
    </div>

    <div class="campo">
      <label for="universidad">
        {{ 'perfil.campos.universidad' | translate }} *
      </label>

      <select
        id="universidad"
        name="universidad"
        [(ngModel)]="universidad"
        required
      >
        <option value="" disabled>Selecciona una universidad</option>

        @for (opcion of universidades; track opcion) {
          <option [value]="opcion">{{ opcion }}</option>
        }
      </select>
    </div>

    @if (mensajeError) {
      <p class="mensaje-error">{{ mensajeError }}</p>
    }

    <div class="acciones">
      <button
        mat-button
        type="button"
        (click)="cancelar.emit()"
        [disabled]="guardando"
      >
        {{ 'compartido.acciones.cancelar' | translate }}
      </button>

      <button
        mat-flat-button
        type="submit"
        [disabled]="guardando || formulario.invalid"
      >
        {{ (guardando ? 'perfil.editar.guardando' : 'compartido.acciones.guardar') | translate }}
      </button>
    </div>
  </form>
</div>
