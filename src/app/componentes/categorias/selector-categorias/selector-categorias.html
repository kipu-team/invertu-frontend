<div class="selector">
  <mat-chip-listbox
    class="selector__chips"
    hideSingleSelectionIndicator
    [value]="seleccionada()"
    (change)="seleccionada.set($event.value ?? null)"
    [attr.aria-label]="'categorias.etiqueta' | translate"
  >
    @for (c of categorias; track c.idCategoria) {
      <mat-chip-option class="selector__chip" [value]="c.idCategoria" (removed)="eliminar(c)">
        {{ c.nombre }}
        @if (c.personalizada && sesion.esPremium()) {
          <button matChipRemove type="button" [attr.aria-label]="'categorias.quitar' | translate: { nombre: c.nombre }">
            <mat-icon>cancel</mat-icon>
          </button>
        }
      </mat-chip-option>
    }
  </mat-chip-listbox>

  <button type="button" class="selector__crear" (click)="crear()">
    <mat-icon>add</mat-icon>
    {{ 'categorias.crear' | translate }}
  </button>
</div>
