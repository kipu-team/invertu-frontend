<h2 mat-dialog-title>{{ 'suscripciones.pago.titulo' | translate: { nombre: nombreServicio() } }}</h2>

<mat-dialog-content>
  <form class="pago" [formGroup]="formulario" (ngSubmit)="registrar()" novalidate>
    <p class="pago__texto">{{ 'suscripciones.pago.texto' | translate }}</p>

    <!-- Monto -->
    <label class="campo">
      <span>{{ 'suscripciones.formulario.monto' | translate }}</span>
      <div class="campo__caja" [class.campo__caja--error]="tieneError('monto')">
        <mat-icon>attach_money</mat-icon>
        <input type="number" formControlName="monto" min="0.01" step="0.01" />
      </div>
      @if (tieneError('monto')) {
        <small class="error"><mat-icon>error</mat-icon>{{ 'suscripciones.formulario.errores.monto' | translate }}</small>
      }
    </label>

    <!-- Fecha del pago: hoy o antes (no futura) -->
    <label class="campo">
      <span>{{ 'suscripciones.pago.fecha' | translate }}</span>
      <div class="campo__caja" [class.campo__caja--error]="tieneError('fecha')">
        <mat-icon>calendar_today</mat-icon>
        <input type="date" formControlName="fecha" [max]="hoy" />
      </div>
      @if (tieneError('fecha')) {
        <small class="error">
          <mat-icon>error</mat-icon>
          {{ (formulario.controls.fecha.hasError('fechaFutura') ? 'suscripciones.pago.errores.fechaFutura' : 'suscripciones.pago.errores.fecha') | translate }}
        </small>
      }
    </label>

    <!-- Categoría (precargada con la del último pago) -->
    <label class="campo">
      <span>{{ 'suscripciones.pago.categoria' | translate }}</span>
      <div class="campo__caja" [class.campo__caja--error]="tieneError('idCategoria')">
        <select formControlName="idCategoria">
          @for (c of categorias(); track c.idCategoria) {
            <option [ngValue]="c.idCategoria">{{ c.nombre }}</option>
          }
        </select>
      </div>
      @if (tieneError('idCategoria')) {
        <small class="error"><mat-icon>error</mat-icon>{{ 'suscripciones.pago.errores.categoria' | translate }}</small>
      }
    </label>

    <!-- Medio de pago (opcional) -->
    <label class="campo">
      <span>{{ 'suscripciones.pago.medioPago' | translate }}</span>
      <div class="campo__caja">
        <select formControlName="medioPago">
          <option [ngValue]="null">{{ 'suscripciones.pago.sinMedio' | translate }}</option>
          @for (m of mediosPago; track m) {
            <option [ngValue]="m">{{ 'movimientos.medios.' + m | translate }}</option>
          }
        </select>
      </div>
    </label>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end" class="acciones">
  <button mat-button type="button" (click)="cancelar()">{{ 'compartido.acciones.cancelar' | translate }}</button>
  <button mat-flat-button type="button" class="boton-verde" [disabled]="guardando()" (click)="registrar()">
    {{ 'suscripciones.acciones.registrarPago' | translate }}
  </button>
</mat-dialog-actions>
